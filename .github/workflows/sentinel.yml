# ============================================================================
# THE SENTINEL — Horadric Cube Containment Protocols (repo-local)
# ============================================================================
# Runs on every push to main and every PR against main in THIS repo — the
# gadget gates its own pull requests, mirroring the Mezzanine and the
# experiment submodules, which each self-gate. A parent-side path filter on a
# gitlink pointer bump never matches, so the gate must live here.
#
# Two jobs:
#   * containment    — frontend (Vue/TS) on Ubuntu: typecheck, lint, format, build
#   * rust-substrate — backend (Rust) on Ubuntu:    fmt, clippy, build, test
#
# The Cube ships a per-platform Tesseract sidecar (`sidecars/tesseract` +
# `eng.traineddata`) that is gitignored — supplied at build time, never
# committed (see src-tauri/sidecars/README.md). Tauri's build script only
# checks that the target-triple-suffixed files EXIST, so the rust-substrate
# job synthesises empty stubs before compiling: we type-check and lint the
# Rust, we do not bundle an installer or run OCR. The real Windows installer
# (`cargo tauri build` + the genuine sidecar) is a separate, Windows-only
# concern and is intentionally out of scope for this Linux gate.
# ============================================================================

name: Sentinel — Horadric Cube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  containment:
    name: Frontend — Typecheck + Lint + Format + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  rust-substrate:
    name: Rust — Fmt + Clippy + Build + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The genuine Tesseract sidecar + language data are gitignored (supplied
      # at build time). Tauri's build script only asserts they EXIST for the
      # host target triple, so empty stubs satisfy a compile-only gate.
      - name: Stub the build-time sidecar + resources
        run: |
          mkdir -p sidecars
          touch sidecars/tesseract-x86_64-unknown-linux-gnu
          chmod +x sidecars/tesseract-x86_64-unknown-linux-gnu
          touch sidecars/eng.traineddata

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test
